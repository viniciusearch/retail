{% extends "base.html" %}

{% block title %}Cadastrar Novo Ativo{% endblock %}

{% block content %}
<div class="container-fluid mt-4" x-data="cadastrarAtivo()">
    <!-- Header -->
    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <h2 class="mb-0">
                <i class="bi bi-plus-circle me-2"></i>Cadastrar Novo Ativo
            </h2>
        </div>
        <div class="col-md-4 text-end">
            <a href="/ativos" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Voltar
            </a>
        </div>
    </div>

    <!-- Stepper -->
    <div class="d-flex justify-content-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
                 :class="etapaAtual >= 1 ? 'bg-success' : 'bg-secondary'"
                 style="width: 40px; height: 40px;">1</div>
            <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
                 :class="etapaAtual >= 2 ? 'bg-danger' : 'bg-secondary'"
                 style="width: 40px; height: 40px;">2</div>
            <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
                 :class="etapaAtual >= 3 ? 'bg-primary' : 'bg-secondary'"
                 style="width: 40px; height: 40px;">3</div>
        </div>
    </div>

    <form @submit.prevent="salvarAtivo" novalidate>
        <!-- ETAPA 1: Identificação -->
        <div class="card shadow-sm mb-4" x-show="etapaAtual === 1">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="bi bi-tag me-2"></i>Identificação Principal</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Código do Ativo *</label>
                        <input type="text" class="form-control" :class="{'is-invalid': erros.codigo_ativo}" x-model="form.codigo_ativo" placeholder="Ex: NB-CTC-001">
                        <div class="invalid-feedback" x-show="erros.codigo_ativo" x-text="erros.codigo_ativo"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Patrimônio</label>
                        <input type="text" class="form-control" x-model="form.patrimonio" placeholder="Ex: 7720">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Número de Série</label>
                        <input type="text" class="form-control" x-model="form.numero_serie" placeholder="Ex: AF12502354461">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Ativo *</label>
                        <select class="form-select" :class="{'is-invalid': erros.tipo_ativo}" x-model="form.tipo_ativo" @change="atualizarCategorias()">
                            <option value="">Selecione...</option>
                            <option value="hardware">Hardware</option>
                            <option value="periferico">Periférico</option>
                            <option value="rede">Rede</option>
                            <option value="software">Software</option>
                            <option value="mobiliario">Mobiliário</option>
                            <option value="radio">Rádio/Walkie-Talkie</option>
                        </select>
                        <div class="invalid-feedback d-block" x-show="erros.tipo_ativo" x-text="erros.tipo_ativo"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Categoria *</label>
                        <select class="form-select" :class="{'is-invalid': erros.categoria}" x-model="form.categoria">
                            <option value="">Selecione o tipo primeiro</option>
                            <template x-for="cat in categoriasDisponiveis" :key="cat">
                                <option :value="cat" x-text="cat"></option>
                            </template>
                        </select>
                        <div class="invalid-feedback d-block" x-show="erros.categoria" x-text="erros.categoria"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status *</label>
                        <select class="form-select" x-model="form.status">
                            <option value="Em uso">Em uso</option>
                            <option value="Devolvido">Devolvido</option>
                            <option value="Desmobilizado">Desmobilizado</option>
                            <option value="Em Estoque">Em Estoque</option>
                            <option value="Com Defeito">Com Defeito</option>
                            <option value="Transferido">Transferido</option>
                            <option value="Em Manutenção">Em Manutenção</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Descrição Completa</label>
                        <input type="text" class="form-control" x-model="form.descricao" placeholder="Ex: LENOVO THINKPAD E14 I5 16GB">
                    </div>
                </div>
            </div>
        </div>

        <!-- ETAPA 2: Relacionamentos -->
        <div class="card shadow-sm mb-4" x-show="etapaAtual === 2">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="bi bi-link-45deg me-2"></i>Relacionamentos</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Proprietário (Empresa) *</label>
                        <select class="form-select choices-sync" :class="{'is-invalid': erros.proprietario_id}" x-model="form.proprietario_id" data-field="proprietario_id">
                            <option value="">Selecione...</option>
                            <template x-for="emp in empresas" :key="emp.id">
                                <option :value="emp.id" x-text="emp.nome"></option>
                            </template>
                        </select>
                        <div class="invalid-feedback d-block" x-show="erros.proprietario_id" x-text="erros.proprietario_id"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Local Atual *</label>
                        <select class="form-select choices-sync" x-model="form.local_atual_id" data-field="local_atual_id">
                            <option value="">Selecione...</option>
                            <template x-for="loc in locais" :key="loc.id">
                                <option :value="loc.id" x-text="loc.nome"></option>
                            </template>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Usuário Atual</label>
                        <select class="form-select choices-sync" :class="{'is-invalid': erros.usuario_atual_id}" x-model="form.usuario_atual_id" data-field="usuario_atual_id">
                            <option value="">Disponível</option>
                            <template x-for="user in usuarios" :key="user.id">
                                <option :value="user.id" x-text="user.nome_completo"></option>
                            </template>
                        </select>
                        <div class="invalid-feedback d-block" x-show="erros.usuario_atual_id" x-text="erros.usuario_atual_id"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Setor</label>
                        <select class="form-select choices-sync" x-model="form.setor_id" data-field="setor_id">
                            <option value="">Selecione...</option>
                            <template x-for="set in setores" :key="set.id">
                                <option :value="set.id" x-text="set.nome"></option>
                            </template>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Projeto / Obra</label>
                        <input type="text" class="form-control" x-model="form.projeto" placeholder="Ex: SCALA DATACENTER TB09">
                    </div>
                </div>
            </div>
        </div>

        <!-- ETAPA 3: Atributos -->
        <div class="card shadow-sm mb-4" x-show="etapaAtual === 3">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="bi bi-info-circle me-2"></i>Atributos Específicos (Opcional)</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Marca</label>
                        <input type="text" class="form-control" x-model="atributos.marca">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" class="form-control" x-model="atributos.modelo">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">IMEI (Celulares/Rádios)</label>
                        <input type="text" class="form-control" x-model="atributos.imei">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Hostname (TI)</label>
                        <input type="text" class="form-control" x-model="atributos.host_name">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Observações</label>
                        <textarea class="form-control" x-model="form.observacoes" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navegação -->
        <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-secondary" @click="anterior()" x-show="etapaAtual > 1">
                <i class="bi bi-arrow-left me-1"></i>Anterior
            </button>
            <button type="button" class="btn btn-primary" @click="proximo()" x-show="etapaAtual < 3">
                Próximo<i class="bi bi-arrow-right ms-1"></i>
            </button>
            <button type="submit" class="btn btn-success" x-show="etapaAtual === 3" :disabled="salvando">
                <span x-show="salvando" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-check-circle me-1" x-show="!salvando"></i>Salvar Ativo
            </button>
        </div>
    </form>
</div>

<script>
function cadastrarAtivo() {
    return {
        etapaAtual: 1,
        salvando: false,
        erros: {},

        // ✅ Dados de dropdowns
        empresas: [],
        usuarios: [],
        locais: [],
        setores: [],
        categoriasDisponiveis: [],

        form: {
            codigo_ativo: '',
            patrimonio: '',
            numero_serie: '',
            tipo_ativo: '',
            categoria: '',
            descricao: '',
            status: 'Devolvido',
            proprietario_id: '',
            usuario_atual_id: '',
            local_atual_id: '',
            setor_id: '',
            projeto: '',
            observacoes: ''
        },

        atributos: {
            marca: '',
            modelo: '',
            imei: '',
            host_name: ''
        },

        categoriasPorTipo: {
            'hardware': ['Notebook', 'Desktop', 'Tablet', 'Smartphone', 'Servidor'],
            'periferico': ['Monitor', 'Teclado', 'Mouse', 'Webcam', 'Headset', 'Impressora', 'Plotter'],
            'rede': ['Roteador', 'Switch', 'Access Point', 'Antena Wi-Fi'],
            'software': ['AutoCAD', 'Office', 'Windows', 'Adobe', 'Outro Software'],
            'mobiliario': ['Cadeira', 'Mesa', 'Arquivo', 'Organizador', 'Armário'],
            'radio': ['Walkie-Talkie', 'Rádio Comunicador'],
            'servico': ['Locação', 'Manutenção', 'Suporte']
        },

        async init() {
            await Promise.all([
                this.carregarEmpresas(),
                this.carregarUsuarios(),
                this.carregarLocais(),
                this.carregarSetores()
            ]);
            console.log('📊 Dados carregados:', {
                empresas: this.empresas.length,
                usuarios: this.usuarios.length,
                locais: this.locais.length,
                setores: this.setores.length
            });
        },

        // ✅ MÉTODO CRÍTICO: sincroniza Choices.js com Alpine após cada mudança de etapa
        sincronizarChoices() {
            this.$nextTick(() => {
                setTimeout(() => {
                    document.querySelectorAll('select.choices-sync').forEach(select => {
                        // Só inicializa se ainda não tem instância ativa
                        if (!select.choicesInstance) {
                            window.initChoices(select);
                        } else {
                            // Re-sincroniza as opções se o x-for mudou
                            try {
                                select.choicesInstance._updateChoices();
                            } catch (e) {
                                // Fallback: destrói e recria
                                window.destroyChoices(select);
                                window.initChoices(select);
                            }
                        }
                        
                        // Aplica o valor atual do form
                        if (select.choicesInstance) {
                            const fieldName = select.dataset.field;
                            const fieldValue = this.form[fieldName];
                            if (fieldValue !== undefined && fieldValue !== '' && fieldValue !== null) {
                                try {
                                    select.choicesInstance.setChoiceByValue(String(fieldValue));
                                } catch (e) {
                                    console.warn('setChoiceByValue falhou:', fieldName, e);
                                }
                            }
                        }
                    });
                }, 150);
            });
        },

        proximo() {
            if (this.etapaAtual === 1 && !this.validarEtapa1()) return;
            if (this.etapaAtual === 2 && !this.validarEtapa2()) return;
            
            this.etapaAtual++;
            // ✅ Re-sincroniza Choices.js ao entrar na etapa 2 (onde estão os dropdowns)
            this.sincronizarChoices();
        },

        anterior() {
            this.etapaAtual--;
            this.sincronizarChoices();
        },

        atualizarCategorias() {
            const tipo = this.form.tipo_ativo;
            this.categoriasDisponiveis = this.categoriasPorTipo[tipo] || [];
            this.form.categoria = '';
        },

        async carregarEmpresas() {
            try {
                const r = await fetch('/api/empresas?dropdown=true');
                this.empresas = await r.json();
            } catch (e) { console.error('Erro empresas:', e); }
        },

        async carregarUsuarios() {
            try {
                const r = await fetch('/api/usuarios?dropdown=true');
                this.usuarios = await r.json();
                console.log('👤 Usuários recebidos:', this.usuarios.length, this.usuarios);
            } catch (e) { console.error('Erro usuários:', e); }
        },

        async carregarLocais() {
            try {
                const r = await fetch('/api/locais?dropdown=true');
                this.locais = await r.json();
            } catch (e) { console.error('Erro locais:', e); }
        },

        async carregarSetores() {
            try {
                const r = await fetch('/api/setores?dropdown=true');
                this.setores = await r.json();
            } catch (e) { console.error('Erro setores:', e); }
        },

        validarEtapa1() {
            this.erros = {};
            let ok = true;
            if (!this.form.codigo_ativo || this.form.codigo_ativo.trim() === '') {
                this.erros.codigo_ativo = 'Código é obrigatório'; ok = false;
            }
            if (!this.form.tipo_ativo) {
                this.erros.tipo_ativo = 'Tipo é obrigatório'; ok = false;
            }
            if (!this.form.categoria || this.form.categoria.trim() === '') {
                this.erros.categoria = 'Categoria é obrigatória'; ok = false;
            }
            if (!ok) {
                Swal.fire({ icon: 'warning', title: 'Etapa 1', text: 'Preencha os campos obrigatórios' });
            }
            return ok;
        },

        validarEtapa2() {
            this.erros = {};
            let ok = true;
            if (!this.form.proprietario_id) {
                this.erros.proprietario_id = 'Proprietário é obrigatório'; ok = false;
            }
            if (!this.form.local_atual_id) {
                this.erros.local_atual_id = 'Local é obrigatório'; ok = false;
            }
            if (this.form.status === 'Em uso' && !this.form.usuario_atual_id) {
                this.erros.usuario_atual_id = 'Ativos "Em uso" exigem usuário vinculado'; ok = false;
            }
            if (!ok) {
                Swal.fire({ icon: 'warning', title: 'Etapa 2', text: 'Preencha os campos obrigatórios' });
            }
            return ok;
        },

        async salvarAtivo() {
            if (!this.validarEtapa1()) { this.etapaAtual = 1; return; }
            if (!this.validarEtapa2()) { this.etapaAtual = 2; return; }

            this.salvando = true;

            try {
                const sanitizar = (val) => {
                    if (val === null || val === undefined) return null;
                    if (typeof val === 'object') {
                        if ('value' in val) return sanitizar(val.value);
                        if ('id' in val) return sanitizar(val.id);
                        if (Array.isArray(val) && val.length === 1) return sanitizar(val[0]);
                        if (Array.isArray(val) && val.length === 0) return null;
                        return String(val);
                    }
                    return val;
                };

                const payload = {
                    codigo_ativo: sanitizar(this.form.codigo_ativo),
                    patrimonio: sanitizar(this.form.patrimonio),
                    numero_serie: sanitizar(this.form.numero_serie),
                    tipo_ativo: sanitizar(this.form.tipo_ativo),
                    categoria: sanitizar(this.form.categoria),
                    descricao: sanitizar(this.form.descricao),
                    status: sanitizar(this.form.status),
                    proprietario_id: sanitizar(this.form.proprietario_id),
                    usuario_atual_id: sanitizar(this.form.usuario_atual_id),
                    local_atual_id: sanitizar(this.form.local_atual_id),
                    projeto: sanitizar(this.form.projeto),
                    observacoes: sanitizar(this.form.observacoes),
                    atributos: {}
                };

                for (const [key, value] of Object.entries(this.atributos)) {
                    if (value && String(value).trim() !== '') {
                        payload.atributos[key] = String(value);
                    }
                }
                if (Object.keys(payload.atributos).length === 0) delete payload.atributos;

                console.log('📦 Payload:', JSON.stringify(payload, null, 2));

                const response = await fetch('/api/ativos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    Toast.fire({ icon: 'success', title: data.mensagem });
                    setTimeout(() => window.location.href = '/ativos', 1500);
                } else {
                    Swal.fire('Erro', data.erro || 'Falha ao salvar', 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                Swal.fire('Erro', 'Falha na comunicação', 'error');
            } finally {
                this.salvando = false;
            }
        }
    }
}
</script>
{% endblock %}
